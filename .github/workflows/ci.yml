name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Run containers as the runner user (bind mounts must stay writable)
        run: echo "UID=$(id -u)" >> "$GITHUB_ENV" && echo "GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Start stack with fake external services
        run: FAKE_SERVICES=true docker compose up --build -d --wait

      - name: Rails tests
        run: docker compose exec -T web bin/rails test

      - name: Downloader tests
        run: docker compose exec -T downloader npm test

      - name: Playwright e2e
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium --only-shell
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
          retention-days: 7

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
